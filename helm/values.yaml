# Valeurs Helm adaptées à un lab kind (ressources réduites, pas de HA).
# Chart: argo/argo-cd (https://github.com/argoproj/argo-helm)

redis-ha:
  enabled: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  service:
    # Exposé via le extraPortMappings de kind/cluster.yaml : hostPort 8080 -> nodePort 30080.
    # Accès direct : https://localhost:8080 (sans port-forward).
    type: NodePort
    # Le chart applique nodePortHttp au port http ET nodePortHttps au port https ;
    # il faut donc deux valeurs distinctes sous peine de "duplicate nodePort".
    nodePortHttp: 30081
    nodePortHttps: 30080

applicationSet:
  replicas: 1

configs:
  params:
    server.insecure: false
